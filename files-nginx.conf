# skillharbor-files：用户上传内容专用源（与门户 :8100 不同源，浏览器同源策略隔离门户令牌）
# 容器：nginx:alpine，端口 8180:80，只读挂载 skillharbor-data 卷的 uploads / tmp 子目录
# 部署：docker run -d --name skillharbor-files --restart unless-stopped -p 8180:80 \
#   -v /var/lib/docker/volumes/skillharbor-data/_data/uploads:/data/uploads:ro \
#   -v /var/lib/docker/volumes/skillharbor-data/_data/tmp:/data/tmp:ro \
#   -v /opt/skillharbor/files-nginx.conf:/etc/nginx/conf.d/default.conf:ro \
#   nginx:alpine

server {
  listen 80;
  server_name _;
  charset utf-8;
  add_header X-Content-Type-Options nosniff always;

  # 下载类工具：强制附件下载（文件名由浏览器按 URL 解码得出）
  location /files/uploads/files/ {
    alias /data/uploads/files/;
    add_header Content-Disposition "attachment";
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  # 工具补充材料：页面截图（内联展示）与产品说明书（强制附件下载）
  location /files/uploads/materials/ {
    alias /data/uploads/materials/;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }
  location ~ ^/files/uploads/materials/([^/]+/manual\.(?:pdf|docx?|zip))$ {
    alias /data/uploads/materials/$1;
    add_header Content-Disposition "attachment";
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  # 版本仓库（历史版本不对外，仅经 sites/ 当前版访问；P3 版本化部署）
  location /files/uploads/releases/ { return 404; }

  # 网页工具目录（静态站点，工具可自由使用自己的 localStorage —— 这是它们自己的源）
  location /files/uploads/ {
    alias /data/uploads/;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  # 审核沙箱预览（草稿目录 data/tmp）
  location /files/uploads-preview/ {
    alias /data/tmp/;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  location / { return 404; }
}
